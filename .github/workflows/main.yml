name: Auto Update IPTV Playlists

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Scraper
        run: python kbsworld_epg.py

      - name: Commit & Push Output
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add kbsworld_epg.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update PhotocallTV channels" && git push)
